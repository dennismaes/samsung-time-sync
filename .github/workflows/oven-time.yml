name: Set Oven Time

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  checkout:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.SMART_THINGS_TOKEN }}
      DEVICE_ID: ${{ vars.OVEN_DEVICE_ID }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          chmod +x set_oven_time.sh
          ./set_oven_time.sh